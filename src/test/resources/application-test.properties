# Test configuration — uses H2 instead of PostgreSQL/Redis
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Disable Flyway for tests — we use ddl-auto instead
spring.flyway.enabled=false

# Redis beans are mocked via @MockBean in tests

# Dummy JWT secret
forgeops.jwt.secret=test_secret_key_minimum_32_characters_long
forgeops.vault.encryption-key=test_vault_key_32_chars_exactly_!!

# Logging
logging.level.eu.forgeops=DEBUG
logging.level.org.springframework.security=WARN
