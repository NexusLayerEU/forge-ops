# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/forgeops}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:forgeops}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:forgeops_secret}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:redis_secret}

# JWT
forgeops.jwt.secret=${FORGEOPS_JWT_SECRET:change_me_in_production_very_long_secret_key_minimum_32_chars}
forgeops.jwt.expiry=${FORGEOPS_JWT_EXPIRY:86400}
forgeops.jwt.refresh-expiry=${FORGEOPS_JWT_REFRESH_EXPIRY:604800}

# Vault encryption
forgeops.vault.encryption-key=${FORGEOPS_VAULT_ENCRYPTION_KEY:change_me_vault_32charkey_exactly}

# Run engine
forgeops.engine.fork-factor=${FORGEOPS_ENGINE_FORK_FACTOR:10}
forgeops.engine.task-timeout=${FORGEOPS_ENGINE_TASK_TIMEOUT:300}
forgeops.engine.ssh.connect-timeout=${FORGEOPS_ENGINE_SSH_CONNECT_TIMEOUT:10}
forgeops.engine.ssh.strict-host-check=${FORGEOPS_ENGINE_SSH_STRICT_HOST_CHECK:false}
forgeops.engine.winrm.timeout=${FORGEOPS_ENGINE_WINRM_TIMEOUT:30}
forgeops.engine.winrm.enabled=${FORGEOPS_ENGINE_WINRM_ENABLED:false}

# Drift scheduler
forgeops.drift.scheduler.enabled=${FORGEOPS_DRIFT_SCHEDULER_ENABLED:true}

# CORS
forgeops.cors.origins=${FORGEOPS_CORS_ORIGINS:http://localhost:3000}

# Logging
logging.level.eu.forgeops=${LOGGING_LEVEL_EU_FORGEOPS:INFO}
logging.level.org.springframework.security=WARN

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Server
server.port=8080

# Async executor
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50
spring.task.execution.pool.queue-capacity=100
